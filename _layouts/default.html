<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}" type="image/png">
  <meta property="og:title" content="{{ site.title }} — {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">tanksalot</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>&copy; {{ 'now' | date: '%Y' }} Silfenco. tanksalot is not a medical device.</div>
      <div class="footer-links">
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="mailto:{{ site.contact_email }}">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
