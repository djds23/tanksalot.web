<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/exports/tanksalot-icon-iOS-Default-32x32@2x.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/exports/tanksalot-icon-iOS-Default-16x16@2x.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="{{ '/assets/icons/exports/tanksalot-icon-iOS-Dark-32x32@2x.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/exports/tanksalot-icon-iOS-Default-60x60@3x.png' | relative_url }}">
  <meta property="og:title" content="{{ site.title }} — {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/assets/icons/exports/tanksalot-icon-iOS-Default-512x512@1x.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <picture>
          <source srcset="{{ '/assets/icons/exports/tanksalot-icon-iOS-Dark-32x32@2x.png' | relative_url }}" media="(prefers-color-scheme: dark)">
          <img class="brand-mark" src="{{ '/assets/icons/exports/tanksalot-icon-iOS-Default-32x32@2x.png' | relative_url }}" alt="" width="28" height="28">
        </picture>
        <span class="brand-name">tanksalot</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>&copy; {{ 'now' | date: '%Y' }} Silfenco. tanksalot is not a medical device.</div>
      <div class="footer-links">
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="mailto:{{ site.contact_email }}">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
