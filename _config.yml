title: tanksalot
tagline: Portable oxygen tank tracking for you and the people you care for.
description: >-
  tanksalot estimates how much oxygen is left in your portable tanks, yours or a
  loved one's, from the fills and sessions you log, so you can see at a glance
  what's likely full, what's empty, and about how long the active tank will last.
email: dean.silfen@gmail.com
baseurl: "/tanksalot.web"
url: "https://djds23.github.io"

brand_color: "#1f9d55"
brand_color_dark: "#157347"

contact_email: dean.silfen@gmail.com
testflight_url: "#"

permalink: pretty

exclude:
